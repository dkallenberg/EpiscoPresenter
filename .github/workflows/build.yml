# Builds the EpiscoPresenter and EpiscoPlanner installers for Windows and
# the Mac (Apple silicon and Intel in one app).
#
# Start it from the repository's Actions tab: "Build installers" → "Run
# workflow" (choose the branch). It also runs when a version tag (v0.2.0)
# is pushed. When it finishes, the installers are at the bottom of the
# run's page under "Artifacts".
#
# A version typed in "Release" when running it (or a pushed version tag)
# also makes a GitHub release, with its tag, and the installers attached: a
# version with a label (v0.2.0-beta.1, v0.3.0-rc.1) is marked "Pre-release"
# (a beta); a plain one (v0.2.0) is a full release. Set the
# version in Cargo.toml and both tauri.conf.json files to match first.
#
# Updates: with the repository secret TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD, if the key has one) and the variable
# TAURI_SIGNING_PUBLIC_KEY, the builds are signed for updating and a release
# also writes presenter.json and planner.json to the "updates" release,
# where the apps look for a newer version of themselves (updater.rs).
#
# The installers are not code-signed: Windows SmartScreen says "Windows
# protected your PC" (More info → Run anyway) and macOS asks once (see the
# README, "Installing on another Mac").

name: Build installers

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Make a GitHub release with this version (e.g. v0.2.0-beta.1 for a beta, v0.2.0 for a full release); leave empty for the installers only"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  EPISCO_UPDATE_PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo test --workspace

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Each build may clear the bundle folder: keep each app's installers
      # as soon as they are made.
      # With the signing key, also the signed update files (.sig).
      - name: Update signing
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # The CLI checks each signature against the config's public key.
            node -e 'require("fs").writeFileSync("updater-on.json", JSON.stringify({bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.EPISCO_UPDATE_PUBKEY.trim()}}}))'
            echo "UPDATER=--config updater-on.json" >> "$GITHUB_ENV"
          fi
      - name: Build EpiscoPresenter
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build $UPDATER
          mkdir -p installers
          cp target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe installers/
          cp target/release/bundle/nsis/*.sig installers/ 2>/dev/null || true
      - name: Build EpiscoPlanner
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build --config src-tauri/planner/bundle.json $UPDATER
          cp target/release/bundle/msi/EpiscoPlanner*.msi target/release/bundle/nsis/EpiscoPlanner*.exe installers/
          cp target/release/bundle/nsis/EpiscoPlanner*.sig installers/ 2>/dev/null || true
          ls -l installers
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installers/*
          if-no-files-found: error

  mac:
    name: Mac
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A universal build joins only the main program for both kinds of Mac;
      # the app also carries the episco-planner program, joined here first.
      - name: Join episco-planner for both kinds of Mac
        run: |
          cargo build --release --bin episco-planner --target aarch64-apple-darwin
          cargo build --release --bin episco-planner --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/episco-planner \
            target/aarch64-apple-darwin/release/episco-planner \
            target/x86_64-apple-darwin/release/episco-planner
      # Each build clears the bundle folder: keep each app's .dmg as soon as
      # it is made.
      # With the signing key, also the signed update files (.app.tar.gz, .sig).
      - name: Update signing
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # The CLI checks each signature against the config's public key.
            node -e 'require("fs").writeFileSync("updater-on.json", JSON.stringify({bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: process.env.EPISCO_UPDATE_PUBKEY.trim()}}}))'
            echo "UPDATER=--config updater-on.json" >> "$GITHUB_ENV"
            echo "BUNDLES=app,dmg" >> "$GITHUB_ENV"
          else
            echo "BUNDLES=dmg" >> "$GITHUB_ENV"
          fi
      - name: Build EpiscoPresenter
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles $BUNDLES $UPDATER
          mkdir -p installers
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg installers/
          cp target/universal-apple-darwin/release/bundle/macos/*.tar.gz* installers/ 2>/dev/null || true
      - name: Build EpiscoPlanner
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles $BUNDLES --config src-tauri/planner/bundle.json $UPDATER
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg installers/
          cp target/universal-apple-darwin/release/bundle/macos/EpiscoPlanner*.tar.gz* installers/ 2>/dev/null || true
          ls -l installers
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: installers/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          ls -l installers
          # v0.2.0-beta.1 → "0.2.0 beta 1"; a label makes it a pre-release.
          case "$TAG" in v[0-9]*) ;; *) echo "The release must look like v0.2.0 or v0.2.0-beta.1 (got $TAG)"; exit 1 ;; esac
          version="${TAG#v}"
          title="EpiscoPresenter $(echo "${version}" | sed -E 's/-([a-z]+)\.?([0-9]*)/ \1 \2/')"
          pre=""
          case "$version" in *-*) pre="--prerelease" ;; esac
          cat > notes.md <<NOTES
          EpiscoPresenter and EpiscoPlanner ${version}.

          **Windows:** download the \`.exe\` (or \`.msi\`) for each app and run it. The installers are not signed: Windows SmartScreen says "Windows protected your PC"; choose **More info → Run anyway**.

          **Mac** (Apple silicon and Intel): download the \`.dmg\` for each app and drag the app into Applications. The apps are not signed by Apple: if macOS says the app "is damaged and can't be opened", run \`xattr -dr com.apple.quarantine /Applications/EpiscoPresenter.app\` (and EpiscoPlanner.app) in Terminal once.
          NOTES
          # Makes the tag too (on the commit just built) when it is new.
          gh release create "$TAG" installers/* --repo "$REPO" --target "$SHA" --title "$title" --notes-file notes.md --generate-notes $pre
      # Where the apps look for a newer version of themselves (updater.rs):
      # presenter.json and planner.json in the "updates" release.
      - name: Tell the apps about it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/update-manifests.py installers "$REPO" "$TAG"
          # presenter.json and planner.json (betas too), and for a full
          # release presenter-release.json and planner-release.json.
          files=$(ls presenter*.json planner*.json 2>/dev/null || true)
          if [ -n "$files" ]; then
            gh release view updates --repo "$REPO" >/dev/null 2>&1 || \
              gh release create updates --repo "$REPO" --target "$SHA" --prerelease \
                --title "Update information" --notes "Used by EpiscoPresenter and EpiscoPlanner to find their newest version. Download the apps from the other releases."
            gh release upload updates $files --repo "$REPO" --clobber
          fi

