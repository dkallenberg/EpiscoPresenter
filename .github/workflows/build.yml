# Builds the EpiscoPresenter and EpiscoPlanner installers for Windows and
# the Mac (Apple silicon and Intel in one app).
#
# Start it from the repository's Actions tab: "Build installers" → "Run
# workflow" (choose the branch). It also runs when a version tag (v0.2.0)
# is pushed. When it finishes, the installers are at the bottom of the
# run's page under "Artifacts".
#
# The installers are not code-signed: Windows SmartScreen says "Windows
# protected your PC" (More info → Run anyway) and macOS asks once (see the
# README, "Installing on another Mac").

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo test --workspace

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build EpiscoPresenter
        run: npx --yes @tauri-apps/cli@2 build
      - name: Build EpiscoPlanner
        run: npx --yes @tauri-apps/cli@2 build --config src-tauri/planner/bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

  mac:
    name: Mac
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build EpiscoPresenter
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
      - name: Build EpiscoPlanner
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg --config src-tauri/planner/bundle.json
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
