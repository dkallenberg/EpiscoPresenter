# Builds the EpiscoPresenter and EpiscoPlanner installers for Windows and
# the Mac (Apple silicon and Intel in one app).
#
# Start it from the repository's Actions tab: "Build installers" → "Run
# workflow" (choose the branch). It also runs when a version tag (v0.2.0)
# is pushed. When it finishes, the installers are at the bottom of the
# run's page under "Artifacts".
#
# The installers are not code-signed: Windows SmartScreen says "Windows
# protected your PC" (More info → Run anyway) and macOS asks once (see the
# README, "Installing on another Mac").

name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Libraries for the desktop app
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - run: cargo test --workspace

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Each build may clear the bundle folder: keep each app's installers
      # as soon as they are made.
      - name: Build EpiscoPresenter
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build
          mkdir -p installers
          cp target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe installers/
      - name: Build EpiscoPlanner
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2 build --config src-tauri/planner/bundle.json
          cp target/release/bundle/msi/EpiscoPlanner*.msi target/release/bundle/nsis/EpiscoPlanner*.exe installers/
          ls -l installers
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: installers/*
          if-no-files-found: error

  mac:
    name: Mac
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # A universal build joins only the main program for both kinds of Mac;
      # the app also carries the episco-planner program, joined here first.
      - name: Join episco-planner for both kinds of Mac
        run: |
          cargo build --release --bin episco-planner --target aarch64-apple-darwin
          cargo build --release --bin episco-planner --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/episco-planner \
            target/aarch64-apple-darwin/release/episco-planner \
            target/x86_64-apple-darwin/release/episco-planner
      # Each build clears the bundle folder: keep each app's .dmg as soon as
      # it is made.
      - name: Build EpiscoPresenter
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg
          mkdir -p installers
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg installers/
      - name: Build EpiscoPlanner
        run: |
          npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg --config src-tauri/planner/bundle.json
          cp target/universal-apple-darwin/release/bundle/dmg/*.dmg installers/
          ls -l installers
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installers
          path: installers/*.dmg
          if-no-files-found: error
