[package]
name = "episco-presenter"
description = "Episcopal worship presentation engine: sanctuary display, stream overlay, scripts and bulletins"
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run` starts the presentation app; `cargo run --bin episco-planner` the planner.
default-run = "episco-presenter"

[lib]
# `_lib` suffix avoids a name clash with the binary on Windows (cargo#8519).
# Desktop only: the template's `staticlib` / `cdylib` outputs are for iOS and
# Android and cost ~1 GB of disk per debug build.
name = "episco_presenter_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
episco-core.workspace = true
episco-sync.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# `macos-private-api` enables transparent windows on macOS (stream overlay).
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
# Downloads the Google Slides deck as a PDF (already used by Tauri).
reqwest = { version = "0.13", features = ["blocking", "query", "form"] }
# Google Drive: sign-in (PKCE) and checking files against Drive's checksums.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
md-5 = "0.10"
